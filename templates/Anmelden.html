<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berichtsheft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h1 class="text-center mb-4">IHK Berichtsheft</h1>

        <div class="card shadow-sm mx-auto" style="max-width: 450px;">
            <div class="card-body p-4">

                <h4 class="mb-4">Anmelden</h4>

                <div class="mb-3">
                    <label class="form-label">Benutzername oder E-Mail</label>
                    <input type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Passwort</label>
                    <input type="password" class="form-control">
                </div>

                <p class="text-muted">
                </p>

                <div class="mb-3">
                    <a href="/PasswortVergessen">Passwort vergessen?</a>
                </div>

                <a href="/Verifizierungs" class="btn btn-primary w-100">
                    Anmelden
                </a>

            </div>
        </div>

    </div>

</body>
</html>
