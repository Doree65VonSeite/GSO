<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>Registrierung</title>
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- Überschrift -->
        <div class="text-center mb-4">
            <h1 class="fw-bold">Registrierung</h1>
            <p class="text-muted">
                Erstelle dein Konto für das IHK Berichtsheft.
            </p>
        </div>

        <!-- Registrierung -->
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">

                <!-- Vorname und Nachname nebeneinander -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Vorname</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nachname</label>
                        <input type="text" class="form-control">
                    </div>
                </div>

                <!-- E-Mail -->
                <div class="mb-3">
                    <label class="form-label">E-Mail-Adresse</label>
                    <input type="email"
                           class="form-control"
                           placeholder="name@beispiel.de">

                    <div class="form-text">
                        Verwende eine E-Mail-Adresse, auf die du Zugriff hast.
                    </div>
                </div>

                <!-- Passwort -->
                <div class="mb-3">
                    <label class="form-label">Passwort</label>
                    <input type="password" class="form-control">

                    <div class="form-text">
                        Verwende ein sicheres Passwort.
                    </div>
                </div>

                <!-- Passwort wiederholen -->
                <div class="mb-4">
                    <label class="form-label">Passwort wiederholen</label>
                    <input type="password" class="form-control">
                </div>

                <!-- Registrieren -->
                <div class="d-grid mb-3">
                    <button type="button" class="btn btn-primary">
                        Registrieren
                    </button>
                </div>

                <!-- Zurück -->
                <div class="text-center">
                    <span class="text-muted">Du hast bereits ein Konto?</span>
                    <a href="/" class="text-decoration-none">
                        Anmelden
                    </a>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
